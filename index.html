<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>거래소별 빗썸 차익 스캐너</title>
    <style>
        body { background-color: #121212; color: #ffffff; font-family: 'Pretendard', sans-serif; margin: 0; padding: 15px; }
        .header { text-align: center; margin-bottom: 15px; }
        .header h1 { color: #f39c12; margin: 0 0 5px 0; font-size: 1.6rem; }
        .sub-info { color: #888; font-size: 0.85rem; }
        .status-badge { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 0.75rem; font-weight: bold; margin-left: 8px; }
        .status-online { background-color: #2ecc71; color: #000; }
        .status-offline { background-color: #e74c3c; color: #fff; }
        
        .grid-container { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; max-width: 1200px; margin: 0 auto; }
        .card { background-color: #1a1a1a; border-radius: 10px; padding: 12px; border: 1px solid #2d2d2d; }
        .card-header { font-size: 1.05rem; font-weight: bold; padding-bottom: 8px; border-bottom: 1px solid #333; display: flex; justify-content: space-between; margin-bottom: 8px; color: #3498db; }
        .table-container { max-height: 40vh; overflow-y: auto; }
        table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.85rem; }
        th { position: sticky; top: 0; background-color: #222; padding: 6px; color: #aaa; font-weight: normal; }
        td { padding: 6px; border-bottom: 1px solid #262626; }
        
        .profit-high { color: #ff9f43; font-weight: bold; font-size: 0.95rem; }
        .profit-normal { color: #2ecc71; font-weight: bold; font-size: 0.95rem; }
    </style>
</head>
<body>

    <div class="header">
        <h1>🚀 빗썸 출발 차익 스캐너 <span id="conn-status" class="status-badge status-offline">연결 중...</span></h1>
        <div class="sub-info">기준 USDT 가격 (빗썸): <span id="usdt-rate" style="color:#f1c40f; font-weight:bold;">-</span> KRW | 필터: 빗썸 출금 가능 & 1.0% 이상</div>
    </div>

    <div class="grid-container" id="exchange-grid"></div>

    <script>
        const exchanges = ['바이낸스', '바이비트', '비트겟', '업비트'];

        function initGrid() {
            const grid = document.getElementById('exchange-grid');
            grid.innerHTML = exchanges.map(ex => `
                <div class="card">
                    <div class="card-header">
                        <span>📊 ${ex} 비교</span>
                        <span id="count-${ex}">0개</span>
                    </div>
                    <div class="table-container">
                        <table>
                            <thead>
                                <tr><th>코인</th><th>빗썸가</th><th>매도가</th><th>수익률</th></tr>
                            </thead>
                            <tbody id="list-${ex}">
                                <tr><td colspan="4" style="text-align:center; color:#555;">데이터 수신 대기 중...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            `).join('');
        }

        async function fetchBinance() {
            try {
                const res = await fetch('https://api.binance.com/api/v3/ticker/price');
                const data = await res.json();
                let prices = {};
                data.forEach(i => {
                    if (i.symbol.endsWith('USDT')) {
                        prices[i.symbol.replace('USDT', '').toUpperCase()] = parseFloat(i.price);
                    }
                });
                return prices;
            } catch(e) { return {}; }
        }

        async function fetchBybit() {
            try {
                const res = await fetch('https://api.bybit.com/v5/market/tickers?category=spot');
                const data = await res.json();
                let prices = {};
                const list = data.result?.list || [];
                list.forEach(i => {
                    if (i.symbol.endsWith('USDT')) {
                        prices[i.symbol.replace('USDT', '').toUpperCase()] = parseFloat(i.lastPrice);
                    }
                });
                return prices;
            } catch(e) { return {}; }
        }

        function formatKrw(price) {
            if (price < 1) return `${price.toFixed(5)}원`;
            if (price < 100) return `${price.toFixed(2)}원`;
            return `${Math.round(price).toLocaleString()}원`;
        }

        function connectWebSocket() {
            const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const socket = new WebSocket(`${wsProtocol}//${window.location.host}/ws`);
            const statusBadge = document.getElementById('conn-status');

            socket.onopen = function() {
                statusBadge.innerText = '실시간 연결됨';
                statusBadge.className = 'status-badge status-online';
            };

            socket.onmessage = async function(event) {
                const serverData = JSON.parse(event.data);
                const usdKrw = parseFloat(serverData.usdt_krw.replace(/,/g, ''));
                document.getElementById('usdt-rate').innerText = serverData.usdt_krw;

                // 브라우저에서 직접 바이낸스와 바이비트 시세 가져오기 (차단 우회 성공)
                const [binancePrices, bybitPrices] = await Promise.all([fetchBinance(), fetchBybit()]);

                let grouped = {};
                exchanges.forEach(ex => grouped[ex] = []);

                // 1. 서버에서 온 데이터(비트겟, 업비트) 분류
                const serverItems = serverData.high || [];
                serverItems.forEach(item => {
                    if (grouped[item.sell_ex]) {
                        grouped[item.sell_ex].push(item);
                    }
                });

                // 2. 서버 데이터 중 빗썸가 정보 매핑을 위해 빗썸가 원본 추출 필요하므로 
                // 임시로 서버 데이터에서 심볼별 빗썸 가격 매핑 생성
                let bithumbPricesMap = {};
                serverItems.forEach(item => {
                    bithumbPricesMap[item.symbol] = parseFloat(item.bithumb_price.replace(/[^0-9.]/g, ''));
                });

                // 바이낸스 데이터 계산 추가
                for (const [sym, fPrice] of Object.entries(binancePrices)) {
                    if (bithumbPricesMap[sym]) {
                        const bPrice = bithumbPricesMap[sym];
                        const fPriceKrw = fPrice * usdKrw;
                        const profit = ((fPriceKrw - bPrice) / bPrice) * 100;
                        if (profit >= 1.0 && profit <= 50.0) {
                            grouped['바이낸스'].push({
                                symbol: sym,
                                bithumb_price: formatKrw(bPrice),
                                sell_price: formatKrw(fPriceKrw),
                                profit: Math.round(profit * 100) / 100
                            });
                        }
                    }
                }

                // 바이비트 데이터 계산 추가
                for (const [sym, fPrice] of Object.entries(bybitPrices)) {
                    if (bithumbPricesMap[sym]) {
                        const bPrice = bithumbPricesMap[sym];
                        const fPriceKrw = fPrice * usdKrw;
                        const profit = ((fPriceKrw - bPrice) / bPrice) * 100;
                        if (profit >= 1.0 && profit <= 50.0) {
                            grouped['바이비트'].push({
                                symbol: sym,
                                bithumb_price: formatKrw(bPrice),
                                sell_price: formatKrw(fPriceKrw),
                                profit: Math.round(profit * 100) / 100
                            });
                        }
                    }
                }

                exchanges.forEach(ex => {
                    renderRows(grouped[ex], `list-${ex}`, `count-${ex}`);
                });
            };

            socket.onclose = function() {
                statusBadge.innerText = '재연결 시도 중...';
                statusBadge.className = 'status-badge status-offline';
                setTimeout(connectWebSocket, 1000);
            };
        }

        function renderRows(list, targetId, countId) {
            const tbody = document.getElementById(targetId);
            document.getElementById(countId).innerText = `${list.length}개`;
            
            if (list.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" style="text-align:center; color:#555;">조건 충족 코인 없음</td></tr>';
                return;
            }

            list.sort((a, b) => b.profit - a.profit);

            tbody.innerHTML = list.map(item => {
                const isHigh = item.profit >= 1.5;
                const profitClass = isHigh ? 'profit-high' : 'profit-normal';
                return `
                    <tr>
                        <td><strong>${item.symbol}</strong></td>
                        <td>${item.bithumb_price}</td>
                        <td>${item.sell_price}</td>
                        <td class="${profitClass}">+${item.profit}%</td>
                    </tr>
                `;
            }).join('');
        }

        initGrid();
        connectWebSocket();
    </script>
</body>
</html>
