<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>실시간 차익 스캐너</title>
    <style>
        body { font-family: sans-serif; background-color: #121212; color: #ffffff; padding: 20px; }
        #status { text-align: center; color: #f39c12; margin-bottom: 20px; font-weight: bold; }
        #content { width: 100%; }
    </style>
</head>
<body>
    <div id="status">🔄 서버 연결 중... (첫 접속 시 1분 정도 걸릴 수 있습니다)</div>
    <div id="content"></div>

    <script>
        const socket = new WebSocket('wss://mandu.onrender.com/ws');

        socket.onopen = function() {
            document.getElementById('status').innerText = '🟢 실시간 데이터 수신 중';
        };

        socket.onmessage = function(event) {
            document.getElementById('content').innerHTML = event.data;
        };

        socket.onclose = function() {
            document.getElementById('status').innerText = '🔴 연결이 끊어졌습니다. 잠시 후 새로고침 해주세요.';
        };

        socket.onerror = function(error) {
            console.error('WebSocket Error:', error);
        };
    </script>
</body>
</html>
