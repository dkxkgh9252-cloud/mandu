<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>실시간 차익 스캐너</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
        }
        #status {
            text-align: center;
            font-size: 14px;
            color: #f39c12;
            margin-bottom: 15px;
            font-weight: bold;
        }
        #content {
            width: 100%;
        }
    </style>
</head>
<body>
    <div id="status">🔄 서버 연결 중...</div>
    <div id="content"></div>

    <script>
        // 서버와 연결 (Render 및 로컬 공용 연결 처리)
        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const host = window.location.host || '127.0.0.1:8000';
        const socket = new WebSocket(`${protocol}//${host}/ws`);

        socket.onopen = function() {
            document.getElementById('status').style.display = 'none'; // 연결되면 상태 문구 숨김
        };

        socket.onmessage = function(event) {
            // main.py에서 보낸 실시간 테이블 화면을 그대로 뿌려줍니다.
            document.getElementById('content').innerHTML = event.data;
        };

        socket.onclose = function() {
            document.getElementById('status').style.display = 'block';
            document.getElementById('status').innerText = '🔴 서버와 연결이 끊어졌습니다. 잠시 후 새로고침 해주세요.';
        };

        socket.onerror = function(error) {
            console.error('WebSocket Error:', error);
        };
    </script>
</body>
</html>
