<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>빗썸 출발 전체 코인 실시간 차익 스캐너</title>
    <style>
        body { font-family: sans-serif; background-color: #121212; color: #ffffff; padding: 20px; }
        h1 { color: #f39c12; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #333; padding: 8px; text-align: center; }
        th { background-color: #1f1f1f; color: #f39c12; }
        tr:nth-child(even) { background-color: #1a1a1a; }
        .positive { color: #2ecc71; font-weight: bold; }
    </style>
</head>
<body>
    <h1>🚀 빗썸 출발 전체 코인 실시간 차익 스캐너</h1>
    <div id="status">서버에 연결 중...</div>
    <div id="content"></div>

    <script>
        // Render 서버의 WebSocket 주소로 연결합니다.
        const socket = new WebSocket('wss://mandu.onrender.com/ws');

        socket.onopen = function() {
            document.getElementById('status').innerText = '🟢 실시간 데이터 수신 중...';
        };

        socket.onmessage = function(event) {
            document.getElementById('content').innerHTML = event.data;
        };

        socket.onclose = function() {
            document.getElementById('status').innerText = '🔴 연결이 끊어졌습니다. 재연결 시도 중...';
        };

        socket.onerror = function(error) {
            console.error('WebSocket Error:', error);
        };
    </script>
</body>
</html>
